spring.application.name=devops-03-backend
server.port=8080
server.servlet.context-path=/api
# MongoDB URI는 환경 변수로 주입 (docker-compose에서 설정)
# 로컬 개발: mongodb://localhost:27017/campus_food
# Docker: mongodb://mongodb:27017/campus_food
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/campus_food}

# Swagger/OpenAPI (option)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT secret key (환경 변수로 주입 - 필수)
jwt.secret=${JWT_SECRET}