plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id "org.sonarqube" version "7.2.0.6526"
}

group = 'com.study'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(22)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

def sonarHostUrl = System.getenv("SONAR_HOST_URL")
def sonarToken = System.getenv("SONAR_TOKEN")

sonarqube {
    properties {
        property "sonar.projectKey", "backend"
        property "sonar.host.url", sonarHostUrl
        property "sonar.login", sonarToken
    }
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-parameters', '-nowarn']
}

tasks.withType(Test) {
    systemProperty "file.encoding", "UTF-8"
    jvmArgs "-Dfile.encoding=UTF-8"
}

dependencies {
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
//	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// JWT 라이브러리 추가
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'de.flapdoodle.embed:de.flapdoodle.embed.mongo:4.11.0'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트용 내장 MongoDB 사용 (환경 변수 불필요)
	// .env 파일이 있으면 로드, 없으면 기본값 사용
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			if (line && !line.startsWith('#')) {
				def (key, value) = line.split('=', 2)
				if (key && value) {
					systemProperty key.trim(), value.trim()
				}
			}
		}
	}

	// 테스트는 내장 MongoDB 사용 (de.flapdoodle.embed.mongo)
	// Atlas 연결하지 않음
}

// .env 파일 자동 로드 (bootRun 실행 시)
tasks.named('bootRun') {
	// .env 파일 읽기
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			// 주석과 빈 줄 무시
			if (line && !line.startsWith('#')) {
				def (key, value) = line.split('=', 2)
				if (key && value) {
					environment key.trim(), value.trim()
				}
			}
		}
		println "✅ .env 파일 로드 완료"
	} else {
		println "⚠️  .env 파일이 없습니다. 기본값 사용."
	}
}